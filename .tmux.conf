set -g prefix C-s

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'loctvl842/monokai-pro.tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Make the status line more pleasant.
set -g mouse on
set -g default-terminal "tmux-256color"

# Configure continuum
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'

# Configure the monokai-pro plugin
set -g @monokai-pro-filter "pro"


bind-key p run-shell "tsm run session-switcher"
bind-key g run-shell "tsm run branch"
bind-key c run-shell "tsm run lazygit"
bind-key h run-shell "tsm run history"
bind-key f run-shell "tsm run yazi"
bind-key k run-shell "tsm run lazydocker"

bind -n C-t run-shell "tsm popup toggle terminal"
bind -n C-a run-shell "tsm popup toggle claude"

bind-key b switch-client -l

# Claude popup key table
bind -T claude C-a run-shell "tsm popup toggle claude"

# Popup terminal configuration
set -g popup-border-lines rounded
set -g popup-border-style "fg=colour245"
bind-key -n -T popup C-f copy-mode

# Use C+t to toggle the popup terminal closed (when in popup)
bind -T popup C-t detach

# Enable copy-mode for scrollback in the popup
bind -T popup C-[ copy-mode
